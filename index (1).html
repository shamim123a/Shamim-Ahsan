<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e11">
<title>SHAMIM PRO</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e11;color:#fff;font-family:Arial}
header{background:#181a20;padding:18px;display:flex;justify-content:space-between}
.logo{color:#f0b90b;font-size:23px;font-weight:bold}
nav{display:flex;justify-content:space-around;background:#181a20;position:sticky;top:0}
nav button{background:transparent;color:white;padding:13px 7px;font-size:12px}
button{background:#f0b90b;color:#111;border:0;border-radius:7px;padding:12px;font-weight:bold}
main{padding:15px}
.card{background:#181a20;padding:18px;border-radius:12px;margin-bottom:15px}
.page{display:none}.page.active{display:block}
.muted{color:#929aa5;font-size:13px}
.balance{font-size:30px;margin:14px 0}
input{width:100%;padding:13px;margin:8px 0;background:#262a33;color:white;border:1px solid #444;border-radius:7px}
.coin{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #30343b}
h2{font-size:19px}
</style>
</head>
<body>
<header>
<div class="logo" id="appName">SHAMIM PRO</div>
<div id="appLogo" style="color:#f0b90b;font-size:25px">◆</div>
</header>
<nav>
<button onclick="page('home')">Home</button>
<button onclick="page('markets')">Markets</button>
<button onclick="page('trade')">Trade</button>
<button onclick="page('wallet')">Wallet</button>
<button onclick="page('settings')">Settings</button>
</nav>
<main>
<section id="home" class="page active">
<div class="card">
<div class="muted">Total Estimated Balance</div>
<div class="balance" id="homeBalance">$10,000.00</div>
<div class="muted">Personal Simulator</div>
</div>
<div class="card">
<h2>My Assets</h2>
<div id="homeCoins"></div>
</div>
</section>
<section id="markets" class="page">
<h2>Markets</h2>
<div class="card" id="marketList"></div>
</section>
<section id="trade" class="page">
<h2>Trade Simulator</h2>
<div class="card">
<label>Coin Name</label>
<input id="tradeCoin" placeholder="BTC">
<label>Amount USD</label>
<input id="tradeAmount" type="number" placeholder="100">
<button onclick="trade()">Save Trade</button>
<p class="muted">Simulation only. No real transactions.</p>
</div>
</section>
<section id="wallet" class="page">
<h2>My Wallet</h2>
<div class="card">
<div class="muted">Available Balance</div>
<div class="balance" id="walletBalance"></div>
<label>Edit Balance USD</label>
<input id="balanceInput" type="number">
<button onclick="saveBalance()">Update Balance</button>
</div>
</section>
<section id="settings" class="page">
<h2>Settings</h2>
<div class="card">
<h2>Change App Name & Logo</h2>
<input id="nameInput" placeholder="App Name">
<input id="logoInput" placeholder="Logo">
<button onclick="saveBrand()">Save Changes</button>
</div>
<div class="card">
<h2>Add or Edit Coin</h2>
<input id="coinName" placeholder="Coin Name">
<input id="coinPrice" type="number" placeholder="Coin Price USD">
<button onclick="addCoin()">Save Coin</button>
<div id="settingsCoins"></div>
</div>
</section>
</main>
<script>
let balance=Number(localStorage.getItem('balance')||10000);
let coins=JSON.parse(localStorage.getItem('coins')||'[{"name":"BTC","price":95000},{"name":"ETH","price":3200},{"name":"BNB","price":600},{"name":"SOL","price":180}]');

function page(id){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
function money(n){
return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function safe(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(){
document.getElementById('homeBalance').textContent=money(balance);
document.getElementById('walletBalance').textContent=money(balance);
document.getElementById('balanceInput').value=balance;
let html=coins.map(c=>'<div class="coin"><b>'+safe(c.name)+'</b><span>'+money(c.price)+'</span></div>').join('');
document.getElementById('homeCoins').innerHTML=html;
document.getElementById('marketList').innerHTML=html;
document.getElementById('settingsCoins').innerHTML=html;
}
function saveBalance(){
let n=Number(document.getElementById('balanceInput').value);
if(!Number.isFinite(n)||n<0)return alert('Invalid balance');
balance=n;
localStorage.setItem('balance',balance);
render();
alert('Balance updated');
}
function addCoin(){
let name=document.getElementById('coinName').value.trim().toUpperCase();
let price=Number(document.getElementById('coinPrice').value);
if(!name||!Number.isFinite(price)||price<=0)return alert('Enter valid details');
let old=coins.find(c=>c.name===name);
if(old)old.price=price;
else coins.push({name,price});
localStorage.setItem('coins',JSON.stringify(coins));
render();
document.getElementById('coinName').value='';
document.getElementById('coinPrice').value='';
alert('Coin saved');
}
function saveBrand(){
let name=document.getElementById('nameInput').value.trim();
let logo=document.getElementById('logoInput').value.trim();
if(name){
localStorage.setItem('appName',name);
document.getElementById('appName').textContent=name;
document.title=name;
}
if(logo){
localStorage.setItem('appLogo',logo);
document.getElementById('appLogo').textContent=logo;
}
alert('Saved');
}
function trade(){
let coin=document.getElementById('tradeCoin').value.trim();
let amount=Number(document.getElementById('tradeAmount').value);
if(!coin||!Number.isFinite(amount)||amount<=0)return alert('Invalid details');
if(amount>balance)return alert('Insufficient balance');
balance-=amount;
localStorage.setItem('balance',balance);
render();
alert('Simulation saved');
}
document.getElementById('appName').textContent=localStorage.getItem('appName')||'SHAMIM PRO';
document.getElementById('appLogo').textContent=localStorage.getItem('appLogo')||'◆';
document.title=localStorage.getItem('appName')||'SHAMIM PRO';
document.getElementById('nameInput').value=localStorage.getItem('appName')||'SHAMIM PRO';
document.getElementById('logoInput').value=localStorage.getItem('appLogo')||'◆';
render();
if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
